<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph（社交分享预览） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="人生模拟器 Life Simulator" />
    <meta property="og:title" content="人生模拟器 - 736 个事件，走完属于你的一生" />
    <meta property="og:description" content="从 0 岁到晚年，在 736 个事件中做出选择。16 条结局、42 个成就，还能用种子码挑战好友的同一段人生。" />

    <meta property="og:image" content="https://999bug.github.io/life-simulator/pwa-512x512.png" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="人生模拟器 - Life Simulator" />
    <meta name="twitter:description" content="纯前端文字人生模拟游戏：736 个事件、16 条结局、42 个成就，可离线游玩，还能用种子码挑战好友。" />
    <meta name="twitter:image" content="https://999bug.github.io/life-simulator/pwa-512x512.png" />

    <!-- 结构化数据（游戏，利于搜索与分享展示） -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "人生模拟器 Life Simulator",
      "description": "纯前端文字人生模拟游戏：736 个事件、16 条结局路线、42 个成就，从 0 岁走完属于你的一生。",
      "url": "https://999bug.github.io/life-simulator/",
      "applicationCategory": "Game",
      "gamePlatform": "Web Browser",
      "operatingSystem": "Any",
      "inLanguage": "zh-CN",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
    }
    </script>
  </head>
  <body class="bg-black">
    <!-- 加载中占位：React 挂载（loadEvents 就绪后）即替换；避免首次访问白屏 -->
    <div id="root">
      <div style="width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at center,#1a1a30 0%,#0a0a14 70%);color:#fff;font-family:'PingFang SC','Microsoft YaHei',sans-serif">
        <p style="margin:0;color:#c9a96e;font-size:22px;letter-spacing:8px">人生模拟器</p>
        <p style="margin:0;color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:4px">L I F E · S I M U L A T O R</p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <span style="width:8px;height:8px;border-radius:50%;background:#c9a96e;opacity:0.9;animation:lsPulse 1.2s infinite ease-in-out"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#c9a96e;opacity:0.5;animation:lsPulse 1.2s 0.2s infinite ease-in-out"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#c9a96e;opacity:0.25;animation:lsPulse 1.2s 0.4s infinite ease-in-out"></span>
        </div>
        <style>
          @keyframes lsPulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.6); opacity: 0.3; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
