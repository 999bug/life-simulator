</line>
<path d="M620,120 Q580,80 550,100" stroke="#8a9a6a" stroke-width="3" fill="none">
</path>
<path d="M620,120 Q590,100 570,130" stroke="#8a9a6a" stroke-width="2" fill="none">
</path>
<ellipse cx="480" cy="352" rx="280" ry="36" fill="rgba(255,245,225,0.14)">
</ellipse>
<g>
