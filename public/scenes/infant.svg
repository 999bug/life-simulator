<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fdf6ea">
</stop>
<stop offset="100%" stop-color="#f5e6d0">
</stop>
</linearGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="rgba(5,8,20,0)">
</stop>
<stop offset="62%" stop-color="rgba(5,8,20,0)">
</stop>
<stop offset="100%" stop-color="rgba(5,8,20,0.30)">
</stop>
</linearGradient>
</defs>
<style>
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:.7}}
@keyframes neon{0%,100%{opacity:.3}50%{opacity:.7}}
@keyframes infantMobile{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.animate-twinkle{animation:twinkle 3s ease-in-out infinite}
.animate-glow{animation:glow 2s ease-in-out infinite}
.animate-neon{animation:neon 3s ease-in-out infinite}
.animate-infant-mobile{animation:infantMobile 12s linear infinite;transform-origin:480px 180px}
</style>
<rect width="960" height="540" fill="url(#sky)">
</rect>
<g transform="translate(0 140)">
<g>
<defs>
<radialGradient id="g1-glow">
<stop offset="0%" stop-color="rgba(255,240,210,0.35)">
</stop>
<stop offset="100%" stop-color="rgba(200,160,100,0)">
</stop>
</radialGradient>
<linearGradient id="g1-wall" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f5e6d0">
</stop>
<stop offset="100%" stop-color="#e8d5b8">
</stop>
</linearGradient>
</defs>
<rect x="0" y="0" width="960" height="400" fill="url(#g1-wall)">
