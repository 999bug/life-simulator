</animateTransform>
<circle cx="0" cy="0" r="20" fill="white">
</circle>
<circle cx="22" cy="-8" r="28" fill="white">
</circle>
<circle cx="45" cy="-2" r="22" fill="white">
</circle>
<circle cx="18" cy="5" r="18" fill="white">
</circle>
</g>
<g transform="translate(50,120) scale(0.5)" opacity="0.2">
<animateTransform attributeName="transform" type="translate" from="10 120" to="170 120" dur="25s" repeatCount="indefinite" additive="sum">
</animateTransform>
<circle cx="0" cy="0" r="20" fill="white">
</circle>
<circle cx="22" cy="-8" r="28" fill="white">
</circle>
<circle cx="45" cy="-2" r="22" fill="white">
</circle>
<circle cx="18" cy="5" r="18" fill="white">
