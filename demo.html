<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生模拟器 - Life Simulator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #1a1a2e;
    --surface-light: #252540;
    --text: #e8e8e8;
    --text-dim: #8888aa;
    --accent: #c9a96e;
    --accent-glow: rgba(201, 169, 110, 0.3);
    --male: #4a90d9;
    --female: #d96b8a;
    --danger: #e85d75;
    --success: #4ac9a0;
    --health: #e85d75;
    --intelligence: #5d9ce8;
    --wealth: #e8c95d;
    --happiness: #5de8a0;
    --social: #c95de8;
    --appearance: #e85dbe;
    --luck: #5de8d4;
    --morality: #e8e8e8;
  }

  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: #000;
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    width: 100vw;
    height: 100vh;
    max-width: 960px;
    max-height: 720px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 0 80px rgba(0,0,0,0.6);
  }

  /* ======== 粒子背景 ======== */
  .particles {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100vh) translateX(40px) scale(0.3); opacity: 0; }
  }

  /* ======== 场景区域 ======== */
  .scene-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    overflow: hidden;
    transition: background 1.5s ease;
  }
  /* 阶段背景 */
  .scene-infant { background: linear-gradient(180deg, #FFE0B2 0%, #FFCC80 40%, #FFECB3 100%); }
  .scene-childhood { background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 40%, #7CB342 100%); }
  .scene-teen { background: linear-gradient(180deg, #2c3e50 0%, #e74c3c 30%, #f39c12 60%, #2ecc71 100%); }
  .scene-young_adult { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); }
  .scene-adult { background: linear-gradient(180deg, #4a5568 0%, #2d3748 50%, #1a202c 100%); }
  .scene-middle_age { background: linear-gradient(180deg, #c05621 0%, #dd6b20 30%, #ecc94b 60%, #f7fafc 100%); }
  .scene-elder { background: linear-gradient(180deg, #f6ad55 0%, #fbd38d 30%, #fefcbf 60%, #e2e8f0 100%); }

  /* ======== 场景装饰 SVG ======== */
  .scene-decor {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; transition: opacity 1s ease;
  }

  /* ======== 人物剪影 ======== */
  .character-container {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    transition: all 0.8s ease;
  }
  .character-svg { transition: all 0.8s ease; }

  /* ======== 场景文字叠加 ======== */
  .age-badge {
    position: absolute; top: 20px; left: 24px;
    font-size: 14px; color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
    padding: 8px 18px; border-radius: 20px; letter-spacing: 2px;
    z-index: 2; transition: all 0.5s ease;
  }
  .stage-label-overlay {
    position: absolute; bottom: 40px; right: 24px;
    font-size: 13px; color: rgba(255,255,255,0.5);
    letter-spacing: 4px; z-index: 2;
  }

  /* ======== 过渡遮罩 ======== */
  .transition-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .transition-overlay.active { opacity: 1; pointer-events: all; }

  /* ======== 状态栏 ======== */
  .status-bar {
    position: absolute; top: 55%; left: 0; right: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
    padding: 10px 20px;
    background: linear-gradient(180deg, rgba(0,0,0,0.95), rgba(10,10,20,0.95));
    backdrop-filter: blur(12px);
    z-index: 3;
    transition: all 0.3s ease;
  }
  .stat-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; padding: 3px 0;
  }
  .stat-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
  .stat-label { color: var(--text-dim); width: 24px; flex-shrink: 0; font-size: 10px; }
  .stat-bar-wrap {
    flex: 1; height: 5px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .stat-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1.2);
  }
  .stat-bar-fill.pulse { animation: barPulse 0.6s ease; }
  @keyframes barPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.8); }
  }
  .stat-val {
    color: var(--text-dim); width: 26px; text-align: right;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
    transition: color 0.5s ease;
  }
  .stat-val.changed-up { color: var(--success); }
  .stat-val.changed-down { color: var(--danger); }

  /* ======== 对话框 ======== */
  .dialog-area {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.97));
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.06);
    z-index: 3;
    transition: height 0.3s ease;
  }
  .dialog-inner { padding: 16px 28px 12px; min-height: 80px; }
  .dialog-meta {
    display: flex; gap: 20px; margin-bottom: 8px;
    font-size: 10px; color: var(--text-dim); letter-spacing: 1px;
  }
  .dialog-meta .name-display { color: var(--accent); font-weight: 600; }
  .dialog-text {
    font-size: 18px; line-height: 1.9; letter-spacing: 1px;
    min-height: 60px; position: relative;
  }
  .dialog-text .cursor::after {
    content: '▎'; color: var(--accent);
    animation: blink 0.8s infinite; margin-left: 1px;
  }
  .dialog-text .cursor.done::after { display: none; }

  /* ======== 选项面板 ======== */
  .choice-panel {
    padding: 8px 28px 18px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .choice-btn {
    width: 100%; padding: 12px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: var(--text);
    font-size: 15px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s ease;
    text-align: left; display: flex; justify-content: space-between; align-items: center;
    font-family: inherit; position: relative; overflow: hidden;
  }
  .choice-btn::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent); transform: scaleY(0);
    transition: transform 0.2s ease; border-radius: 0 2px 2px 0;
  }
  .choice-btn:hover {
    background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2);
    transform: translateX(6px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .choice-btn:hover::before { transform: scaleY(1); }
  .choice-btn:active { transform: scale(0.98); transition: transform 0.05s; }
  .choice-effects {
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px;
    white-space: nowrap; flex-shrink: 0; margin-left: 12px;
  }
  .choice-effects .pos { color: var(--success); }
  .choice-effects .neg { color: var(--danger); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ======== 标题页 ======== */
  .screen-title {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #1a1a30 0%, #0a0a14 70%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; position: relative; overflow: hidden;
  }
  .screen-title .title-decor {
    position: absolute; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 60%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    animation: titleGlow 4s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }
  .title-logo {
    font-size: 56px; font-weight: 200; letter-spacing: 14px;
    color: var(--accent); text-shadow: 0 0 50px var(--accent-glow);
    z-index: 1; animation: fadeInDown 1.4s ease;
  }
  .title-subtitle {
    font-size: 14px; color: var(--text-dim); letter-spacing: 8px;
    z-index: 1; animation: fadeInUp 1.4s ease;
  }
  .name-input-wrap {
    z-index: 1; animation: fadeIn 1.8s ease;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .name-input-wrap label {
    font-size: 12px; color: var(--text-dim); letter-spacing: 3px;
  }
  .name-input-wrap input {
    width: 220px; padding: 10px 16px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: var(--text); font-size: 16px;
    text-align: center; letter-spacing: 3px; outline: none;
    font-family: inherit; transition: all 0.3s ease;
  }
  .name-input-wrap input:focus {
    border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow);
  }
  .gender-select {
    display: flex; gap: 20px; z-index: 1; animation: fadeIn 2s ease;
  }
  .gender-btn {
    width: 130px; height: 150px;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    background: rgba(255,255,255,0.03); cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    color: var(--text-dim); font-size: 16px; letter-spacing: 2px;
  }
  .gender-btn:hover {
    transform: translateY(-6px); border-color: rgba(255,255,255,0.3);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }
  .gender-btn .icon { font-size: 44px; transition: transform 0.3s ease; }
  .gender-btn:hover .icon { transform: scale(1.15); }
  .gender-btn.male:hover { border-color: var(--male); box-shadow: 0 12px 30px rgba(74,144,217,0.25); color: var(--male); }
  .gender-btn.female:hover { border-color: var(--female); box-shadow: 0 12px 30px rgba(217,107,138,0.25); color: var(--female); }
  .gender-btn.selected.male { border-color: var(--male); box-shadow: 0 0 35px rgba(74,144,217,0.35); background: rgba(74,144,217,0.1); color: var(--male); }
  .gender-btn.selected.female { border-color: var(--female); box-shadow: 0 0 35px rgba(217,107,138,0.35); background: rgba(217,107,138,0.1); color: var(--female); }
  .start-btn {
    padding: 14px 56px; border: none; border-radius: 30px;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: rgba(255,255,255,0.3); font-size: 17px; letter-spacing: 6px;
    cursor: pointer; transition: all 0.4s ease; z-index: 1;
    font-weight: 400; border: 1px solid rgba(255,255,255,0.08);
  }
  .start-btn.active {
    background: linear-gradient(135deg, var(--accent), #a88b4e);
    color: #1a1a2e; font-weight: 700; border-color: transparent;
    box-shadow: 0 8px 32px var(--accent-glow);
  }
  .start-btn.active:hover { transform: scale(1.06); }

  /* ======== 结局页 ======== */
  .screen-summary {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0a0a14 0%, #1a1a2e 55%, #0a0a14 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 40px; overflow-y: auto; gap: 16px; position: relative;
  }
  .summary-title {
    font-size: 38px; font-weight: 200; letter-spacing: 10px; color: var(--accent);
    animation: fadeInDown 0.8s ease;
  }
  .summary-subtitle {
    font-size: 14px; color: var(--text-dim); letter-spacing: 4px;
  }
  .summary-desc {
    color: var(--text-dim); font-size: 14px; text-align: center;
    max-width: 440px; line-height: 2;
    animation: fadeIn 1.2s ease;
  }
  .summary-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    width: 100%; max-width: 620px; animation: fadeInUp 1s ease;
  }
  .summary-stat {
    text-align: center; padding: 14px 8px;
    background: var(--surface); border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.04);
    transition: all 0.3s ease;
  }
  .summary-stat:hover {
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }
  .summary-stat .val { font-size: 26px; font-weight: 300; }
  .summary-stat .lbl { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .score-circle {
    width: 90px; height: 90px; border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: var(--accent); font-weight: 200;
    animation: fadeIn 1.5s ease; position: relative;
  }
  .score-circle::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.2);
  }
  .timeline {
    width: 100%; max-width: 620px; animation: fadeInUp 1.3s ease;
  }
  .timeline h3 {
    font-size: 13px; letter-spacing: 4px; color: var(--accent);
    margin-bottom: 10px; font-weight: 400;
  }
  .timeline-item {
    display: flex; gap: 12px; padding: 6px 0;
    font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .timeline-item .age { color: var(--accent); min-width: 34px; }
  .timeline-item .desc { color: var(--text-dim); }
  .restart-btn {
    padding: 12px 36px; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px; background: transparent;
    color: var(--text-dim); font-size: 14px; letter-spacing: 4px;
    cursor: pointer; transition: all 0.3s ease; margin-top: 4px;
    font-family: inherit;
  }
  .restart-btn:hover {
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============ 工具函数 ============
function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

// ============ 常量 ============
const ATTR_NAMES = {
  health:'健康', intelligence:'智力', wealth:'财富', happiness:'幸福',
  social:'社交', appearance:'魅力', luck:'运气', morality:'道德'
};
const ATTR_COLORS = {
  health:'#e85d75', intelligence:'#5d9ce8', wealth:'#e8c95d',
  happiness:'#5de8a0', social:'#c95de8', appearance:'#e85dbe',
  luck:'#5de8d4', morality:'#e8e8e8'
};
const ATTR_ICONS = {
  health:'💪', intelligence:'🧠', wealth:'💰', happiness:'😊',
  social:'👥', appearance:'🎨', luck:'🍀', morality:'⚖️'
};

const STAGES = ['infant','childhood','teen','young_adult','adult','middle_age','elder'];
const STAGE_LABELS = {
  infant:'婴儿期', childhood:'童年', teen:'少年',
  young_adult:'青年', adult:'中年', middle_age:'中老年', elder:'晚年'
};
const STAGE_RANGES = {
  infant:[0,2], childhood:[3,11], teen:[12,17],
  young_adult:[18,29], adult:[30,49], middle_age:[50,64], elder:[65,90]
};

// ============ 粒子系统 ============
function createParticles(container) {
  const wrap = document.createElement('div');
  wrap.className = 'particles';
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 1.5 + Math.random() * 3;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:-${Math.random()*20}px;
      background:rgba(201,169,110,${0.15 + Math.random()*0.25});
      animation-duration:${8 + Math.random()*15}s;
      animation-delay:${Math.random()*10}s;
    `;
    wrap.appendChild(p);
  }
  container.appendChild(wrap);
}

// ============ 场景装饰 ============
function createSceneDecor(stage, container) {
  const el = document.createElement('div');
  el.className = 'scene-decor';
  const svg = [];

  if (stage === 'infant') {
    // 柔和云朵 + 星星
    svg.push(`<circle cx="120" cy="80" r="45" fill="rgba(255,255,255,0.25)"/>
      <circle cx="160" cy="70" r="35" fill="rgba(255,255,255,0.2)"/>
      <circle cx="85" cy="75" r="30" fill="rgba(255,255,255,0.2)"/>
      <circle cx="680" cy="100" r="40" fill="rgba(255,255,255,0.2)"/>
      <circle cx="720" cy="90" r="30" fill="rgba(255,255,255,0.15)"/>
      <circle cx="500" cy="40" r="2" fill="rgba(255,255,200,0.5)"/>
      <circle cx="550" cy="55" r="1.5" fill="rgba(255,255,200,0.4)"/>
      <circle cx="450" cy="30" r="1" fill="rgba(255,255,200,0.3)"/>`);
  } else if (stage === 'childhood') {
    // 树 + 蝴蝶 + 阳光
    svg.push(`<circle cx="80" cy="250" r="55" fill="#5a8a3c"/>
      <circle cx="50" cy="230" r="40" fill="#4a7a2c"/>
      <circle cx="110" cy="235" r="38" fill="#6a9a4c"/>
      <rect x="72" y="300" width="16" height="80" fill="#6b4c3b" rx="4"/>
      <circle cx="750" cy="240" r="50" fill="#5a8a3c"/>
      <circle cx="720" cy="220" r="35" fill="#4a7a2c"/>
      <rect x="742" y="290" width="16" height="70" fill="#6b4c3b" rx="4"/>
      <circle cx="400" cy="50" r="35" fill="rgba(255,255,200,0.4)"/>
      <circle cx="400" cy="50" r="25" fill="rgba(255,255,150,0.6)"/>
      <text x="200" y="180" font-size="18" fill="rgba(100,180,255,0.3)">🦋</text>
      <text x="600" y="160" font-size="14" fill="rgba(100,180,255,0.25)">🦋</text>`);
  } else if (stage === 'teen') {
    // 城市剪影 + 星星
    svg.push(`<rect x="0" y="220" width="100%" height="180" fill="rgba(0,0,0,0.25)"/>
      <rect x="30" y="180" width="50" height="120" fill="rgba(0,0,0,0.35)" rx="2"/>
      <rect x="100" y="150" width="40" height="150" fill="rgba(0,0,0,0.3)" rx="2"/>
      <rect x="160" y="200" width="60" height="100" fill="rgba(0,0,0,0.35)" rx="2"/>
      <rect x="240" y="130" width="35" height="170" fill="rgba(0,0,0,0.3)" rx="2"/>
      <rect x="600" y="160" width="45" height="140" fill="rgba(0,0,0,0.3)" rx="2"/>
      <rect x="660" y="190" width="55" height="110" fill="rgba(0,0,0,0.35)" rx="2"/>
      <rect x="740" y="140" width="40" height="160" fill="rgba(0,0,0,0.3)" rx="2"/>
      <rect x="800" y="170" width="50" height="130" fill="rgba(0,0,0,0.35)" rx="2"/>
      ${Array.from({length:30}, (_,i) => `<circle cx="${Math.random()*900}" cy="${Math.random()*160}" r="${0.5+Math.random()*1.5}" fill="rgba(255,255,255,${0.3+Math.random()*0.5})"/>`).join('')}`);
  } else if (stage === 'young_adult') {
    // 现代城市夜景
    svg.push(`<rect x="0" y="200" width="100%" height="200" fill="rgba(0,0,0,0.3)"/>
      <rect x="20" y="170" width="55" height="130" fill="rgba(10,10,30,0.5)" rx="2"/>
      <rect x="90" y="140" width="45" height="160" fill="rgba(10,10,30,0.45)" rx="2"/>
      <rect x="150" y="180" width="65" height="120" fill="rgba(10,10,30,0.5)" rx="2"/>
      <rect x="650" y="155" width="50" height="145" fill="rgba(10,10,30,0.45)" rx="2"/>
      <rect x="720" y="175" width="60" height="125" fill="rgba(10,10,30,0.5)" rx="2"/>
      <rect x="800" y="145" width="45" height="155" fill="rgba(10,10,30,0.45)" rx="2"/>

// ============ 人物剪影 ============
function createCharacter(stage, gender, container) {
  const wrap = document.createElement('div');
  wrap.className = 'character-container';
  let svgContent = '';

  const baseX = 450, baseY = 380; // 脚底位置

  if (stage === 'infant') {
    // 婴儿 — 襁褓
    svgContent = `
      <ellipse cx="${baseX}" cy="${baseY-18}" rx="22" ry="28" fill="rgba(255,255,255,0.12)"/>
      <circle cx="${baseX}" cy="${baseY-42}" r="14" fill="rgba(255,220,180,0.15)"/>
      <ellipse cx="${baseX}" cy="${baseY-50}" rx="8" ry="5" fill="rgba(255,200,150,0.1)"/>`;
  } else if (stage === 'childhood') {
    // 小孩
    svgContent = `
      <circle cx="${baseX}" cy="${baseY-95}" r="18" fill="rgba(255,220,180,0.15)"/>
      <rect x="${baseX-12}" y="${baseY-77}" width="24" height="40" fill="rgba(255,255,255,0.1)" rx="10"/>
      <rect x="${baseX-14}" y="${baseY-37}" width="8" height="30" fill="rgba(255,255,255,0.08)" rx="4"/>
      <rect x="${baseX+6}" y="${baseY-37}" width="8" height="30" fill="rgba(255,255,255,0.08)" rx="4"/>`;
  } else if (stage === 'teen') {
    // 少年
    svgContent = `
      <circle cx="${baseX}" cy="${baseY-130}" r="20" fill="rgba(255,220,180,0.15)"/>
      <rect x="${baseX-14}" y="${baseY-110}" width="28" height="55" fill="rgba(255,255,255,0.1)" rx="12"/>
      <rect x="${baseX-16}" y="${baseY-55}" width="10" height="45" fill="rgba(255,255,255,0.08)" rx="5"/>
      <rect x="${baseX+6}" y="${baseY-55}" width="10" height="45" fill="rgba(255,255,255,0.08)" rx="5"/>`;
  } else if (stage === 'young_adult') {
    // 青年
    svgContent = `
      <circle cx="${baseX}" cy="${baseY-155}" r="22" fill="rgba(255,220,180,0.15)"/>
      <rect x="${baseX-16}" y="${baseY-133}" width="32" height="65" fill="rgba(255,255,255,0.1)" rx="14"/>
      <rect x="${baseX-18}" y="${baseY-68}" width="12" height="55" fill="rgba(255,255,255,0.08)" rx="6"/>
      <rect x="${baseX+6}" y="${baseY-68}" width="12" height="55" fill="rgba(255,255,255,0.08)" rx="6"/>`;
  } else if (stage === 'adult') {
    // 中年 — 略宽
    svgContent = `
      <circle cx="${baseX}" cy="${baseY-155}" r="23" fill="rgba(255,220,180,0.15)"/>
      <rect x="${baseX-19}" y="${baseY-132}" width="38" height="68" fill="rgba(255,255,255,0.1)" rx="15"/>
      <rect x="${baseX-20}" y="${baseY-64}" width="13" height="52" fill="rgba(255,255,255,0.08)" rx="6"/>
      <rect x="${baseX+7}" y="${baseY-64}" width="13" height="52" fill="rgba(255,255,255,0.08)" rx="6"/>`;
  } else if (stage === 'middle_age') {
    // 中老年 — 微驼
    svgContent = `
      <circle cx="${baseX+5}" cy="${baseY-150}" r="23" fill="rgba(255,220,180,0.14)"/>
      <rect x="${baseX-14}" y="${baseY-128}" width="36" height="65" fill="rgba(255,255,255,0.09)" rx="14" transform="rotate(-3,${baseX},${baseY-95})"/>
      <rect x="${baseX-18}" y="${baseY-63}" width="13" height="50" fill="rgba(255,255,255,0.07)" rx="6"/>
      <rect x="${baseX+5}" y="${baseY-63}" width="13" height="50" fill="rgba(255,255,255,0.07)" rx="6"/>`;
  } else {
    // 晚年 — 佝偻 + 拐杖
    svgContent = `
      <circle cx="${baseX+8}" cy="${baseY-140}" r="22" fill="rgba(255,220,180,0.12)"/>
      <rect x="${baseX-12}" y="${baseY-120}" width="34" height="58" fill="rgba(255,255,255,0.08)" rx="13" transform="rotate(-6,${baseX+5},${baseY-90})"/>
      <rect x="${baseX-16}" y="${baseY-62}" width="12" height="48" fill="rgba(255,255,255,0.06)" rx="5"/>
      <rect x="${baseX+4}" y="${baseY-62}" width="12" height="48" fill="rgba(255,255,255,0.06)" rx="5"/>
      <line x1="${baseX+30}" y1="${baseY-100}" x2="${baseX+50}" y2="${baseY+5}" stroke="rgba(255,255,255,0.1)" stroke-width="3" stroke-linecap="round"/>`;
  }

  wrap.innerHTML = `<svg class="character-svg" width="100%" height="100%" viewBox="0 0 900 400" preserveAspectRatio="xMidYMax slice">${svgContent}</svg>`;
  container.appendChild(wrap);
}

// ============ 游戏状态 ============
function createState(gender, name) {
  return {
    gender, name: name || (gender === 'male' ? '小明' : '小美'),
    age: 0, stage: 'infant', stageIdx: 0,
    attrs: {
      health: 80, intelligence: 30, wealth: 20, happiness: 70,
      social: 20, appearance: 50, luck: 50, morality: 50
    },
    flags: [], history: [], phase: 'playing'
  };
}

    text:'黄昏时分，你坐在公园的长椅上。叶子一片一片地落下来，像缓缓翻过的日历。\n\n一个年轻人路过，停下来问你在想什么。\n\n你想了想。一生走到这里，如果你要把最重要的东西浓缩成一句话，那会是什么？',
    choices:[
      { text:'「勇敢去爱，别怕受伤。没有什么比爱更值得。」', effects:'最终章', outcomes:{ attr:{happiness:10,morality:5}, final:true } },
      { text:'「钱很重要，但不是最重要的。健康和时间才是。」', effects:'最终章', outcomes:{ attr:{wealth:5,morality:10,health:5}, final:true } },
      { text:'「做你自己。别人的期待是别人的，你的人生是你的。」', effects:'最终章', outcomes:{ attr:{happiness:8,intelligence:5,morality:3}, final:true } },
      { text:'「如果重来一次，不知道还会不会选这条路……」', effects:'最终章', outcomes:{ attr:{happiness:-3,luck:8,morality:3}, final:true } }
    ] }
];

// ============ 核心引擎 ============
const app = document.getElementById('app');
let state = null;
let chosenGender = null;
let playerName = '';
let eventPtr = 0;      // 当前事件索引
let feedbackText = '';  // 选择反馈文字
let isTyping = false;
let typeTimer = null;

function findEvent() {
  const now = EVENTS[eventPtr];
  if (now && now.stage === state.stage && now.age <= state.age + 2) return now;
  // 尝试推进阶段
  const nextIdx = STAGES.indexOf(state.stage) + 1;
  if (nextIdx < STAGES.length) {
    const nextStage = STAGES[nextIdx];
    const [minAge] = STAGE_RANGES[nextStage];
    state.stage = nextStage;
    state.stageIdx = nextIdx;
    state.age = minAge;
    // 找到下一阶段的第一个事件
    for (let i = 0; i < EVENTS.length; i++) {
      if (EVENTS[i].stage === nextStage) { eventPtr = i; return EVENTS[i]; }
    }
  }
  return null;
}

function applyOutcomes(out) {
  if (out.attr) {
    for (const [k, v] of Object.entries(out.attr)) {
      state.attrs[k] = clamp(state.attrs[k] + v, 0, 100);
    }
  }
  if (out.flags) out.flags.forEach(f => { if (!state.flags.includes(f)) state.flags.push(f); });
  if (out.nextAge) state.age = out.nextAge;
  // 阶段更新
  for (const [s, [lo, hi]] of Object.entries(STAGE_RANGES)) {
    if (state.age >= lo && state.age <= hi && state.stage !== s) {
      state.stage = s;
      state.stageIdx = STAGES.indexOf(s);
      break;
    }
  }
  // 老年健康衰减
  if (state.age >= 65) {
    state.attrs.health = clamp(state.attrs.health - 3 + (state.attrs.luck / 60), 0, 100);
  }
  // 死亡判定
  if (state.attrs.health <= 0 || state.age >= 90) {
    state.phase = 'summary';
    state.age = Math.min(state.age, 90);
    state.attrs.health = Math.max(state.attrs.health, 0);
  }
}

// ============ 渲染：标题页 ============
function renderTitle() {
  eventPtr = 0; feedbackText = ''; state = null; chosenGender = null; playerName = '';
  if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
  app.innerHTML = `
    <div class="screen-title">
      <div class="title-decor"></div>
      <div class="title-logo">人生模拟器</div>
      <div class="title-subtitle">L I F E  ·  S I M U L A T O R</div>
      <div class="name-input-wrap">
        <label>你的名字</label>
        <input type="text" id="nameInput" placeholder="输入名字或留空" maxlength="8">
      </div>
      <div class="gender-select">
        <div class="gender-btn male" id="btnMale"><span class="icon">👦</span><span>男 生</span></div>
        <div class="gender-btn female" id="btnFemale"><span class="icon">👧</span><span>女 生</span></div>
      </div>
      <button class="start-btn" id="startBtn" disabled>开 始 人 生</button>
    </div>
  `;
  createParticles(app.querySelector('.screen-title'));

  const nameInput = document.getElementById('nameInput');
  const btnMale = document.getElementById('btnMale');
  const btnFemale = document.getElementById('btnFemale');
  const startBtn = document.getElementById('startBtn');

  function updateStart() {
    if (chosenGender) {
      startBtn.classList.add('active');
      startBtn.disabled = false;
    }
  }

  btnMale.addEventListener('click', () => {
    chosenGender = 'male';
    btnMale.classList.add('selected'); btnFemale.classList.remove('selected');
    if (!nameInput.value) nameInput.value = '小明';
    updateStart();
  });
  btnFemale.addEventListener('click', () => {
    chosenGender = 'female';
    btnFemale.classList.add('selected'); btnMale.classList.remove('selected');
    if (!nameInput.value) nameInput.value = '小美';
    updateStart();
  });
  startBtn.addEventListener('click', () => {
    if (!chosenGender) return;
    playerName = nameInput.value.trim() || (chosenGender === 'male' ? '小明' : '小美');
    state = createState(chosenGender, playerName);
    eventPtr = 0;
    renderGame();
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startBtn.click(); });
}

// ============ 渲染：游戏主界面 ============
function renderGame() {
  if (state.phase === 'summary') { renderSummary(); return; }

  // 处理选择反馈
  if (feedbackText) {
    renderFeedback();
    return;
  }

  const evt = findEvent();
  if (!evt) {
    state.age = 85; state.attrs.health = 0; state.phase = 'summary';
    renderSummary(); return;
  }

  const isAuto = evt.choices.length === 1 && evt.choices[0].text === '……';
  const sceneClass = `scene-${evt.stage}`;

  // 构建 HTML
  let html = `<div class="transition-overlay active" id="transition"></div>`;

  // 场景区域
  html += `<div class="scene-area ${sceneClass}" id="sceneArea">
    <div class="age-badge">${state.gender === 'male' ? '♂' : '♀'} ${state.age}岁 · ${STAGE_LABELS[evt.stage]}</div>
    <div class="stage-label-overlay">${STAGE_LABELS[evt.stage]}</div>
  </div>`;

  // 状态栏
  html += `<div class="status-bar" id="statusBar">${buildStatsHTML(state.attrs)}</div>`;

  // 对话框
  html += `<div class="dialog-area" id="dialogArea">
    <div class="dialog-inner">
      <div class="dialog-meta">
        <span class="name-display">${state.name}</span>
        <span>${state.age}岁</span>
        <span>${STAGE_LABELS[evt.stage]}</span>
      </div>
      <div class="dialog-text" id="dialogText"><span class="cursor"></span></div>
    </div>
    ${!isAuto ? `<div class="choice-panel hidden" id="choicePanel">${evt.choices.map((c,i) => `
      <button class="choice-btn" data-idx="${i}">
        <span>${c.text}</span>
        ${c.effects ? `<span class="choice-effects">${colorEffects(c.effects)}</span>` : ''}
      </button>`).join('')}</div>` : ''}
  </div>`;

  app.innerHTML = html;

  // 场景装饰 + 人物
  const sceneArea = document.getElementById('sceneArea');
  createSceneDecor(evt.stage, sceneArea);
  createCharacter(evt.stage, state.gender, sceneArea);

  // 过渡动画
  setTimeout(() => {
    const overlay = document.getElementById('transition');
    if (overlay) overlay.classList.remove('active');
    // 开始打字
    startTypewriter(evt.text, isAuto, evt);
  }, 400);
}

function buildStatsHTML(attrs, highlights) {
  return Object.entries(attrs).map(([k, v]) => {
    const color = ATTR_COLORS[k];
    const changed = highlights && highlights[k];
    const valClass = changed ? (changed > 0 ? 'changed-up' : 'changed-down') : '';
    return `<div class="stat-item">
      <span class="stat-icon">${ATTR_ICONS[k]}</span>
      <span class="stat-label">${ATTR_NAMES[k]}</span>
      <div class="stat-bar-wrap"><div class="stat-bar-fill" style="width:${v}%;background:${color}"></div></div>
      <span class="stat-val ${valClass}">${v}</span>
    </div>`;
  }).join('');
}

function colorEffects(effects) {
  return effects.split(' ').map(t => {
    if (t.startsWith('+')) return `<span class="pos">${t}</span>`;
    if (t.startsWith('-')) return `<span class="neg">${t}</span>`;
    return t;
  }).join(' ');
}

// ============ 打字机效果 ============
function startTypewriter(text, isAuto, evt) {
  const el = document.getElementById('dialogText');
  if (!el) return;
  el.innerHTML = '<span class="cursor"></span>';
  const cursor = el.querySelector('.cursor');
  let i = 0;
  isTyping = true;

  function type() {
    if (i < text.length) {
      const c = text[i];
      if (c === '\n') {
        const br = document.createElement('br');
        cursor.before(br);
      } else {
        const span = document.createElement('span');
        span.textContent = c;
        cursor.before(span);
      }
      i++;
      typeTimer = setTimeout(type, 30 + Math.random() * 25);
    } else {
      cursor.classList.add('done');
      isTyping = false;
      if (isAuto) {
        // 自动事件：点击继续
        const dialogArea = document.getElementById('dialogArea');
        if (dialogArea) {
          dialogArea.style.cursor = 'pointer';
          dialogArea.addEventListener('click', function handler() {
            dialogArea.removeEventListener('click', handler);
            dialogArea.style.cursor = '';
            feedbackText = '';
            const out = evt.choices[0].outcomes;
            applyOutcomes(out);
            eventPtr++;
            if (state.phase === 'summary') renderSummary();
            else renderGame();
          });
        }
      } else {
        // 显示选项
        const panel = document.getElementById('choicePanel');
        if (panel) {
          panel.classList.remove('hidden');
          panel.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              if (isTyping) return;
              handleChoice(parseInt(btn.dataset.idx), evt);
            });
          });
        }
      }
    }
  }
  typeTimer = setTimeout(type, 200);
}

function handleChoice(idx, evt) {
  const ch = evt.choices[idx];
  const out = ch.outcomes;

  // 构建反馈文本
  const changes = out.attr || {};
  const parts = Object.entries(changes).filter(([,v]) => v !== 0)
    .map(([k, v]) => `${v > 0 ? '+' : ''}${v} ${ATTR_ICONS[k]}${ATTR_NAMES[k]}`);
  feedbackText = `你选择了「${ch.text}」\n\n${parts.join('  ')}`;

  // 记录历史
  state.history.push({ age: state.age, stage: state.stage, event: evt.id, choice: idx, text: ch.text });

  applyOutcomes(out);
  eventPtr++;

  if (out.final || state.phase === 'summary') {
    state.phase = 'summary';
    renderSummary();
  } else {
    renderGame();
  }
}

// ============ 反馈页面 ============
function renderFeedback() {
  const evt = findEvent();
  if (!evt) { renderGame(); return; }
  const sceneClass = evt ? `scene-${evt.stage}` : 'scene-adult';

  let html = `<div class="transition-overlay active" id="transition"></div>`;
  html += `<div class="scene-area ${sceneClass}" id="sceneArea">
    <div class="age-badge">${state.gender === 'male' ? '♂' : '♀'} ${state.age}岁 · ${STAGE_LABELS[state.stage]}</div>
    <div class="stage-label-overlay">${STAGE_LABELS[state.stage]}</div>
  </div>`;
  html += `<div class="status-bar" id="statusBar">${buildStatsHTML(state.attrs)}</div>`;
  html += `<div class="dialog-area" id="dialogArea" style="cursor:pointer">
    <div class="dialog-inner">
      <div class="dialog-meta"><span class="name-display">${state.name}</span><span>${state.age}岁</span></div>
      <div class="dialog-text" style="white-space:pre-line;text-align:center;color:var(--accent)">${feedbackText}</div>
      <div style="text-align:center;font-size:11px;color:var(--text-dim);margin-top:10px;animation:pulse 2s infinite">▼ 点击继续</div>
    </div>
  </div>`;
  app.innerHTML = html;

  const sceneArea = document.getElementById('sceneArea');
  createSceneDecor(state.stage, sceneArea);
  createCharacter(state.stage, state.gender, sceneArea);
  setTimeout(() => {
    const overlay = document.getElementById('transition');
    if (overlay) overlay.classList.remove('active');
  }, 300);

  // 点击继续
  document.getElementById('dialogArea').addEventListener('click', function handler() {
    feedbackText = '';
    if (state.phase === 'summary') renderSummary();
    else renderGame();
  });
}

// ============ 结局页 ============
function renderSummary() {
  if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
  const attrs = state.attrs;
  const avg = Math.round(Object.values(attrs).reduce((a, b) => a + b, 0) / 8);

  let title, desc;
  if (avg >= 75) {
    title = '辉煌的一生'; desc = '回望来路，满目星辰。你活出了大多数人只敢梦想的人生，每一个重要选择都踩在了对的位置上。\n\n此生无憾。';
  } else if (avg >= 60) {
    title = '充实的一生'; desc = '没有惊天动地，但每一步都走得踏实。有爱、有事做、有所期待——也许这就是最好的生活。';
  } else if (avg >= 45) {
    title = '平凡的一生'; desc = '有得有失，有笑有泪。你的人生像大多数人的一样，不够完美，但足够真实。';
  } else if (avg >= 30) {
    title = '坎坷的一生'; desc = '命运对你并不慷慨，你做过错误的选择，也承受过不该承受的苦。\n\n但这一路走来，你已经尽力了。';
  } else {
    title = '艰难的一生'; desc = '这一生写满了挣扎。如果真的有来世，愿你能被温柔以待。';
  }

  const statsHTML = Object.entries(attrs).map(([k, v]) => `
    <div class="summary-stat">
      <div class="val" style="color:${ATTR_COLORS[k]}">${v}</div>
      <div class="lbl">${ATTR_ICONS[k]} ${ATTR_NAMES[k]}</div>
    </div>`).join('');

  const timelineHTML = state.history.slice(-10).map(h => `
    <div class="timeline-item"><span class="age">${h.age}岁</span><span class="desc">${h.text}</span></div>`).join('');

  app.innerHTML = `<div class="screen-summary">
    <div class="summary-subtitle">${state.gender === 'male' ? '♂' : '♀'} ${state.name} · 享年 ${state.age} 岁</div>
    <div class="summary-title">${title}</div>
    <div class="summary-desc">${desc}</div>
    <div class="score-circle">${avg}</div>
    <div style="font-size:11px;color:var(--text-dim);letter-spacing:3px">综合评分</div>
    <div class="summary-stats">${statsHTML}</div>
    <div class="timeline"><h3>📋 重要选择回顾</h3>${timelineHTML}</div>
    <button class="restart-btn" id="restartBtn">重新开始</button>
  </div>`;

  document.getElementById('restartBtn').addEventListener('click', renderTitle);
}

// ============ 脉冲动画（废弃，用CSS） ============

// 启动
renderTitle();
</script>
